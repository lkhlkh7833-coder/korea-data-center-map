body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}

.body{padding:14px 16px 28px;display:grid;gap:18px}

.bars i{display:block;height:7px;border-radius:2px}

 <dl><dt>위치</dt><dd>${esc(c.addr||c.sido+' '+(c.sgg||''))}</dd><dt>좌표 정밀도</dt><dd>${esc(c.prec)}${c.aprec?`<br><span class="note">지도 표시: ${esc(c.aprec)}</span>`:''}</dd>${c.op?`<dt>사업자</dt><dd>${esc(c.op)}</dd>`:''}</dl>
 <div><h2>규모</h2>${mwRows.length?`<dl>${mwRows.map(([k,v])=>`<dt>${k}</dt><dd class="mono">${fmt(v)} MW</dd>`).join('')}</dl>`:'<div class="note">공개된 MW 수치 없음</div>'}
 <div class="note" style="margin-top:6px">해석: ${esc(c.mwt)} · 근거: ${esc(c.mwq)}</div>${c.note?`<div class="note">${esc(c.note)}</div>`:''}</div>
 ${c.src?`<div class="note">출처: <a href="${esc(c.src)}" target="_blank" rel="noopener">${esc(c.src.replace(/^https?:\/\//,'').slice(0,60))}</a> · 정제일 ${esc(c.vdate)}</div>`:''}`;
 bind();panel.parentElement.scrollTop=0;
 if(fly&&c.pin!=='none'){const p=proj([c.lng,c.lat]);svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity.translate(W/2,H/2).scale(Math.max(K,14)).translate(-p[0],-p[1]))}}
svg.on('click',e=>{if(e.target===svg.node()){if(st.sel){st.sel=null;draw();render()}}});
function hiRegion(){gL.selectAll('path').attr('class',f=>'prov'+(st.region&&RG(f.properties.n)===st.region?' on':''))}
function pickRegion(r,fly){st.region=r;st.sel=null;setPage(2);hiRegion();draw();
 if(fly){const fs=prov.features.filter(f=>RG(f.properties.n)===r);if(fs.length){const b=d3.geoBounds({type:'FeatureCollection',features:fs});zoomTo([b[0][0],b[0][1],b[1][0],b[1][1]])}}}
function setPage(n){st.page=n;document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-selected',+b.dataset.page===n));render()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{st.sel=null;draw();setPage(+b.dataset.page)});
// swipe between pages on touch
(()=>{let x0=null;const el=document.querySelector('aside');el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});el.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>60){setPage(dx<0?2:1)}x0=null},{passive:true})})();
function render(){st.page===2?regionView():overview()}
function regionView(){
 const all=C.filter(c=>st.g.has(c.g));
 const ORD=['서울','경기·인천','충청권','강원','대경권','부울경','전북','호남권','제주'];
 const regs=d3.rollups(all,v=>({n:v.length,mw:d3.sum(v,c=>c.mw||0)}),c=>RG(c.sido)).sort((a,b)=>ORD.indexOf(a[0])-ORD.indexOf(b[0]));
 if(!st.region){
  panel.innerHTML=`<div><h2>지역을 고르세요</h2><div class="note" style="margin-bottom:8px">지도에서 지역을 누르거나 아래에서 고르면 그 권역 데이터센터가 정리됩니다. 권역은 정부 5극 3특 구분(충청권·호남권·대경권·부울경 + 강원·전북·제주)을 따르되, 수도권은 서울과 경기·인천으로 나눴습니다.</div>
  ${regs.map(([r,o])=>`<div class="row" tabindex="0" data-rg="${esc(r)}"><span></span><span>${esc(r)}<span class="s">${esc(RSUB[r]||'')}</span></span><span class="num"><b>${o.n}</b>건 · ${fmt(o.mw)}MW<br>발전 ${fmt(d3.sum(PP.filter(p=>p.rg===r),p=>p.mw)/1000)}GW</span></div>`).join('')}</div>`;
  panel.querySelectorAll('[data-rg]').forEach(el=>{const go=()=>pickRegion(el.dataset.rg,true);el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter')go()}});return}
 const v=all.filter(c=>RG(c.sido)===st.region).sort((a,b)=>(b.mw||0)-(a.mw||0)||(b.lt||0)-(a.lt||0));
 const byG=G.map(([k,l,col])=>{const s=v.filter(c=>c.g===k);return [l,col,s.length,d3.sum(s,c=>c.mw||0)]});
 const mx=Math.max(1,...byG.map(b=>b[3]));
 const ltSum=d3.sum(v,c=>c.lt||0), nMW=v.filter(c=>c.mw).length;
 const sgg=d3.rollups(v,s=>s.length,c=>({'서울특별시':'서울','인천광역시':'인천','경기도':'경기','대전광역시':'대전','세종특별자치시':'세종','충청남도':'충남','충청북도':'충북','광주광역시':'광주','전라남도':'전남','전남광주통합특별시':'전남','대구광역시':'대구','경상북도':'경북','부산광역시':'부산','울산광역시':'울산','경상남도':'경남','강원특별자치도':'강원','전북특별자치도':'전북','제주특별자치도':'제주'}[c.sido]||c.sido)+' '+(c.sgg||'미상')).sort((a,b)=>b[1]-a[1]);
 const sidoB=d3.rollups(v,s=>({n:s.length,mw:d3.sum(s,c=>c.mw||0)}),c=>c.sido==='전남광주통합특별시'?'전라남도':c.sido).sort((a,b)=>b[1].n-a[1].n);
 panel.innerHTML=`<button type="button" class="back" id="allrg">← 지역 목록</button>
 <div><h3>${esc(st.region)} <span class="note" style="font-weight:400">${esc(RSUB[st.region]||'')}</span></h3><div class="note" style="margin-top:4px">데이터센터 ${v.length}건 · MW 공개 ${nMW}건 · 근사 위치 ${v.filter(c=>c.pin==='approx').length}건</div></div>
 <div style="display:flex;gap:22px;flex-wrap:wrap"><div><div class="mono" style="font-size:26px;color:var(--fg)">${v.length}</div><div class="note">사업 수</div></div>
 <div><div class="mono" style="font-size:26px;color:var(--fg)">${fmt(d3.sum(v,c=>c.mw||0))}</div><div class="note">시설·1단계 MW 합</div></div>
 ${ltSum?`<div><div class="mono" style="font-size:26px;color:var(--muted)">${fmt(ltSum)}</div><div class="note">장기·캠퍼스 계획 MW</div></div>`:''}</div>
 <div><h2>단계별</h2><div class="bars">${byG.map(b=>`<div><span>${b[0]} <span class="mono">${b[2]}건</span></span><i style="width:${Math.max(b[3]?3:0,100*b[3]/mx)}%;background:var(${b[1]})"></i><span class="mono">${fmt(b[3])}MW</span></div>`).join('')}</div></div>
 ${sidoB.length>1?`<div><h2>시도별</h2>${sidoB.map(([s,o])=>`<div class="row" style="cursor:default"><span></span><span>${esc(s)}</span><span class="num"><b>${o.n}</b>건 · ${fmt(o.mw)}MW</span></div>`).join('')}</div>`:''}
 <div><h2>시군구</h2><div class="note" style="line-height:1.9">${sgg.map(([s,n])=>`${esc(s)} <b style="color:var(--fg)">${n}</b>`).join(' · ')}</div></div>
 ${(()=>{const ps=PP.filter(p=>p.rg===st.region).sort((a,b)=>b.mw-a.mw);if(!ps.length)return `<div><h2>발전소</h2><div class="note">이 권역에는 데이터베이스상 발전소가 없습니다.</div></div>`;
   const pf=PF.map(([k,l,col])=>{const s=ps.filter(p=>p.f===k);return [l,col,s.length,d3.sum(s,p=>p.mw)]});const pm=Math.max(1,...pf.map(x=>x[3]));
   return `<div><h2>발전소 ${ps.length}곳 · ${fmt(d3.sum(ps,p=>p.mw)/1000)}GW</h2><div class="bars">${pf.map(b=>`<div><span>${b[0]} <span class="mono">${b[2]}곳</span></span><i style="width:${b[3]?Math.max(3,100*b[3]/pm):0}%;background:var(${b[1]})"></i><span class="mono">${fmt(b[3])}MW</span></div>`).join('')}</div>
   <div class="note" style="margin:8px 0 2px">큰 발전소 · 2021년 이후 신규 ${ps.filter(p=>p.new).length}곳 ${fmt(d3.sum(ps.filter(p=>p.new),p=>p.mw))}MW</div>${ps.slice(0,6).concat(ps.slice(6).filter(p=>p.new)).map((p,i)=>`<div class="row" tabindex="0" data-pp="${ps.indexOf(p)}"><span class="sw" style="background:var(${PFC[p.f]});border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)"></span><span>${esc(p.n)}<span class="s">${esc(p.fk)}${p.new?' · '+p.yr+'년~ 신규':''}</span></span><span class="num"><b>${fmt(p.mw)}</b>MW</span></div>`).join('')}</div>`})()}
 <div><h2>데이터센터 목록 · 규모 큰 순</h2>${v.map(row).join('')}</div>
 <div class="note">MW 합은 공개 수치의 단순 합이며 수전·IT부하·발표 용량이 섞여 있습니다. 장기·캠퍼스 계획 MW는 따로 더했습니다.</div>`;
 {const ps=PP.filter(p=>p.rg===st.region).sort((a,b)=>b.mw-a.mw);panel.querySelectorAll('[data-pp]').forEach(el=>{const go=()=>showPP(ps[+el.dataset.pp]);el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter')go()}})}
 bind();document.getElementById('allrg').onclick=()=>{st.region=null;hiRegion();render()};panel.parentElement.scrollTop=0}
let t;new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(layout,100)}).observe(wrap);
layout();render();
})();
</script>

</body></html>
